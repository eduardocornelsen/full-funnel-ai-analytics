name: Scheduled Refresh — Daily Golden Metrics

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:

# Only one data-refresh run at a time — it commits to the repo.
concurrency:
  group: synthetic-data-writes
  cancel-in-progress: false

jobs:
  refresh-duckdb:
    name: Refresh DuckDB golden layer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dbt packages
        working-directory: dbt_project
        run: dbt deps

      - name: Write dbt profiles.yml
        run: cp dbt_project/profiles.yml.example dbt_project/profiles.yml

      # Regenerated in the runner, NOT committed: appends are deterministic
      # (seeded per calendar date), so every machine — CI, a fresh clone, the
      # owner's laptop — recomputes identical rows locally. The committed CSVs
      # are a frozen baseline; only golden_metrics.json is committed daily.
      - name: Regenerate synthetic appends up to today
        run: python scripts/daily_synthetic_append.py

      - name: Load DuckDB
        run: python scripts/load_duckdb.py

      - name: dbt run
        working-directory: dbt_project
        run: dbt run --target duckdb

      - name: dbt test
        working-directory: dbt_project
        run: dbt test --target duckdb

      - name: Generate golden metrics
        run: python scripts/generate_golden_metrics.py --target duckdb

      - name: Validate — no drift, and data must be current to today
        run: python scripts/validate_metrics.py --target duckdb --strict-freshness

      - name: Commit updated golden_metrics.json (never the CSVs)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily refresh — golden_metrics.json [skip ci]"
          file_pattern: "dashboards/golden_metrics.json"
