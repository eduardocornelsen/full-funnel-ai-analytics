name: Warehouse Deploy — BigQuery + Snowflake

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Warehouse target (bigquery / snowflake / both)"
        required: false
        default: "both"

# One deploy at a time per branch — truncate-reload deploys must never overlap.
concurrency:
  group: warehouse-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [bigquery, snowflake]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dbt packages
        working-directory: dbt_project
        run: dbt deps

      # ── BigQuery auth: write service account key to temp file ───────────────
      - name: Write BigQuery service account key
        if: matrix.target == 'bigquery'
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY_JSON }}' > /tmp/gcp_key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_key.json" >> $GITHUB_ENV
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      # ── Write dbt profiles.yml from template ────────────────────────────────
      - name: Write dbt profiles.yml
        run: cp dbt_project/profiles.yml.example dbt_project/profiles.yml
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

      # ── Load raw data into warehouse ─────────────────────────────────────────
      # Deploy the COMMITTED dataset — the same CSVs the golden layer was
      # generated from. Regenerating data here would load a different random
      # universe into the warehouse and break cross-warehouse metric parity.
      - name: Verify committed dataset present (fallback: standalone)
        id: dataset
        run: |
          if [ -f data/mock_marketing/google_ads_daily_performance.csv ]; then
            echo "✅ Deploying committed CSVs"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️  No committed CSVs — generating standalone (structural deploy only)"
            python scripts/generate_mock_marketing_data.py --standalone
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load data into ${{ matrix.target }}
        run: python scripts/load_${{ matrix.target }}.py
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

      # ── dbt run + test ───────────────────────────────────────────────────────
      - name: dbt run — ${{ matrix.target }}
        working-directory: dbt_project
        run: dbt run --target ${{ matrix.target }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

      - name: dbt test — ${{ matrix.target }}
        working-directory: dbt_project
        run: dbt test --target ${{ matrix.target }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

      # ── Cross-warehouse parity gate ───────────────────────────────────────────
      # Validate the COMMITTED golden_metrics.json (generated from DuckDB by the
      # scheduled refresh) against this warehouse. Same data + same dbt models
      # on a different engine must produce the same metrics — this is the
      # project's cross-warehouse zero-drift guarantee, enforced.
      #
      # This workflow never writes golden_metrics.json: the DuckDB scheduled
      # refresh is its single writer. (Previously the BigQuery job committed a
      # golden file generated from freshly randomized data, silently clobbering
      # the real artifact.)
      # Skipped on the standalone fallback: freshly generated random data is a
      # different universe than the committed golden file, so parity would be
      # guaranteed to fail — the fallback is a structural deploy only.
      - name: Validate — committed golden layer matches ${{ matrix.target }}
        if: steps.dataset.outputs.committed == 'true'
        run: python scripts/validate_metrics.py --target ${{ matrix.target }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
