version: 2

sources:
  - name: olist
    # DuckDB loads raw tables into `main`; cloud warehouses keep raw data in its
    # own schema (Snowflake: RAW_SCHEMA, default RAW; BigQuery: the target dataset).
    schema: "{{ 'main' if target.type == 'duckdb' else (env_var('RAW_SCHEMA', '') or ('RAW' if target.type == 'snowflake' else target.schema)) }}"
    description: "Olist Brazilian E-Commerce dataset (Kaggle)"
    tables:
      - name: orders
      - name: order_items
      - name: order_payments
      - name: order_reviews
      - name: customers
      - name: sellers
      - name: products
      - name: geolocation
      - name: category_translation
        identifier: "product_category_name_translation"

  - name: marketing
    # DuckDB loads raw tables into `main`; cloud warehouses keep raw data in its
    # own schema (Snowflake: RAW_SCHEMA, default RAW; BigQuery: the target dataset).
    schema: "{{ 'main' if target.type == 'duckdb' else (env_var('RAW_SCHEMA', '') or ('RAW' if target.type == 'snowflake' else target.schema)) }}"
    description: "Synthetic marketing platform data"
    tables:
      - name: google_ads_daily_performance
      - name: google_ads_campaigns
      - name: meta_ads_daily_performance
      - name: meta_ads_campaigns
      - name: ga4_daily_sessions
      - name: hubspot_contacts
      - name: hubspot_deals
      - name: salesforce_opportunities
      - name: salesforce_accounts
      - name: marketing_attribution
