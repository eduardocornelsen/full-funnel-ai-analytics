name: "olist_analytics"
version: "1.0.0"
config-version: 2
profile: "olist_analytics"
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

models:
  olist_analytics:
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table

# Project-wide date variables — override at run time with:
#   dbt build --vars '{"window_start":"2025-06-01","window_end":"2025-09-01"}'
#
# These drive:
#   - metricflow_time_spine.sql (time_spine_start / time_spine_end)
#   - fct_marketing_daily.sql  (window_start / window_end)
#   - int_dates.sql            (time_spine_start / time_spine_end)
#
# window_start / window_end default to null: fct_marketing_daily then spans the
# full source data range, so the anchor auto-detected by
# generate_golden_metrics.py (MAX(date)) rolls forward with every daily append.
# Set them only for pinned, reproducible snapshots:
#   dbt run --vars '{"window_start":"YYYY-MM-DD","window_end":"YYYY-MM-DD"}'
#
# Postmortem (2026-07): literal-date fallbacks here froze the mart at 2026-03-15
# while raw data kept growing — 3 months of silent staleness that the drift
# validator could not see. Do not reintroduce literal dates as defaults.
# See CLAUDE.md §9 for the full anchor-detection rules.
vars:
  time_spine_start: "2024-01-01"   # earliest date MetricFlow spine must cover; extend for older data
  time_spine_end: null             # null = today + 1 year at build time (a literal here re-arms the staleness bug)
  window_start: null               # null = span full source range (see postmortem above)
  window_end:   null               # null = span full source range (see postmortem above)
