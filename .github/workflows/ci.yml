name: CI — PR Gate

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ruff lint + package install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package (editable, dev extras)
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: CLI smoke test
        run: fullfunnel --help
      - name: Agent configs match canonical source
        run: python scripts/build_agent_configs.py --check

  dbt-test:
    name: dbt compile + test (DuckDB)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dbt packages
        working-directory: dbt_project
        run: dbt deps

      - name: Write dbt profiles.yml
        run: cp dbt_project/profiles.yml.example dbt_project/profiles.yml

      - name: Bootstrap mock data (skipped if CSVs are committed to repo)
        run: |
          if [ -f data/mock_marketing/google_ads_daily_performance.csv ]; then
            echo "✅ Mock marketing CSVs found — validating committed (Olist-anchored) data"
            wc -l data/mock_marketing/*.csv
          else
            echo "⚠️  No mock CSVs in repo — generating standalone synthetic data (structural test only)"
            echo "    To test real data: commit data/mock_marketing/*.csv from your local machine."
            python scripts/generate_mock_marketing_data.py --standalone
          fi

      # Deterministic catch-up: regenerates the same rows on every machine,
      # proving the regenerate-don't-commit data model works from a fresh clone.
      - name: Regenerate synthetic appends up to today
        run: python scripts/daily_synthetic_append.py

      - name: Load DuckDB
        run: python scripts/load_duckdb.py

      - name: dbt run (staging only — fast)
        working-directory: dbt_project
        run: dbt run --target duckdb --select staging

      - name: dbt run (full)
        working-directory: dbt_project
        run: dbt run --target duckdb

      - name: dbt test
        working-directory: dbt_project
        run: dbt test --target duckdb

      - name: Generate golden metrics
        run: python scripts/generate_golden_metrics.py --target duckdb

      - name: Validate golden layer (no drift)
        run: python scripts/validate_metrics.py --target duckdb

  pytest:
    name: pytest suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
