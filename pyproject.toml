[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "full-funnel-ai-analytics"
version = "0.10.0"
description = "Governed marketing analytics for AI agents — dbt golden layer + MCP servers + drift/staleness gates"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["analytics", "dbt", "mcp", "semantic-layer", "agentic-bi", "duckdb", "marketing-attribution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Core = everything the zero-credential DuckDB demo path needs.
# Warehouse drivers, ML, and the Streamlit app are opt-in extras so a user
# who wants only the demo doesn't install BigQuery/Snowflake/XGBoost.
dependencies = [
    # numpy upper-bounded: synthetic data is regenerated (not committed) and
    # must be byte-identical everywhere — tests/test_determinism.py guards the
    # random-stream stability this depends on. Raise the bound only with that
    # test green on the new version.
    "pandas>=2.1.0",
    "numpy>=1.26.0,<3.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
    "dbt-core>=1.9.0,<2.0",
    "dbt-duckdb>=1.9.0",
    "dbt-metricflow>=0.8.0",
    "fastmcp>=0.1.0",
    "mcp>=1.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
bigquery = [
    "dbt-bigquery>=1.9.0",
    "google-cloud-bigquery>=3.13.0",
    "google-cloud-bigquery-storage>=2.22.0",
]
snowflake = ["snowflake-connector-python>=3.6.0"]
postgres = ["dbt-postgres>=1.9.0", "supabase>=2.0.0"]
ml = [
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "mlflow>=2.9.0",
    "shap>=0.43.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
app = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "anthropic>=0.40.0",
    "openpyxl>=3.1.0",
]
olist = ["kaggle>=1.5.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "httpx>=0.25.0",
    "ruff>=0.4.0",
]

[project.scripts]
fullfunnel = "fullfunnel.cli:main"

[project.urls]
Homepage = "https://github.com/eduardocornelsen/full-funnel-ai-analytics"
Documentation = "https://github.com/eduardocornelsen/full-funnel-ai-analytics/tree/main/docs"
Changelog = "https://github.com/eduardocornelsen/full-funnel-ai-analytics/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["dbt_project", "data", "demo", "dashboards"]

[tool.ruff.lint]
# Start with the error-class gate (syntax errors, undefined names, unused
# imports) so CI is green today; widen rule sets as the codebase is cleaned up.
select = ["E9", "F63", "F7", "F82", "F401"]
