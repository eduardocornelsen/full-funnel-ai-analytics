version: 2

models:
  - name: fct_orders
    description: Central fact table — delivered orders with revenue, attribution, and review data
    columns:
      - name: order_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: order_date
        tests:
          - not_null
      - name: revenue
        tests:
          - not_null

  - name: fct_marketing_daily
    description: >
      Daily spend, conversions, and session KPIs — the mart the golden layer
      reads. Model contract ENFORCED: the golden generator, MetricFlow
      semantic models, and the drift validator all depend on these exact
      columns and types; a silent column change here breaks all three.
    config:
      contract:
        enforced: true
    columns:
      - name: date
        data_type: date
        tests:
          - not_null
          - unique   # one row per calendar day — the grain of this mart
      - name: total_google_spend
        data_type: double
        tests: [not_null]
      - name: total_meta_spend
        data_type: double
        tests: [not_null]
      - name: total_spend
        data_type: double
        tests: [not_null]
      - name: total_ad_conversions
        data_type: hugeint
        tests: [not_null]
      - name: total_conversions
        data_type: hugeint
        tests: [not_null]
      - name: ga4_total_sessions
        data_type: hugeint
        tests: [not_null]
      - name: ga4_engaged_sessions
        data_type: hugeint
        tests: [not_null]
      - name: blended_cac
        data_type: double
      - name: cost_per_session
        data_type: double

  - name: fct_channel_performance
    description: >
      Aggregated spend, revenue, orders, ROAS, and CAC per (date × channel).
      Grain is daily × channel after the time-dimension refactor — channel
      alone is not unique.
    tests:
      # Grain test: exactly one row per (date, channel). Documented since the
      # refactor but never enforced until dbt_utils was installed.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [date, channel]
    columns:
      - name: date
        tests:
          - not_null
      - name: channel
        tests:
          - not_null
      - name: total_spend
        tests:
          - not_null
      - name: attributed_revenue
        tests:
          - not_null

  - name: fct_marketing_attribution
    description: >
      Revenue credited to each channel under four attribution models.
      Grain is (order_date × channel) — channel alone is not unique.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_date, channel]
    columns:
      - name: order_date
        tests:
          - not_null
      - name: channel
        tests:
          - not_null
      - name: first_touch_revenue
        tests:
          - not_null
      - name: last_touch_revenue
        tests:
          - not_null
      - name: linear_revenue
        tests:
          - not_null
      - name: time_decay_revenue
        tests:
          - not_null

  - name: fct_pipeline
    description: >
      Deal-level CRM pipeline — UNION of HubSpot deals and Salesforce opportunities.
      Grain is one row per deal (deal_id is the unique key).
    columns:
      - name: deal_id
        tests:
          - unique
          - not_null
      - name: amount
        tests:
          - not_null
      - name: source
        tests:
          - not_null
          - accepted_values:
              values: ['hubspot', 'salesforce']

  - name: fct_lead_scoring_features
    description: Feature table for XGBoost lead scoring model — one row per customer
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: total_orders
        tests:
          - not_null
      - name: is_high_value
        tests:
          - not_null

  - name: fct_daily_revenue
    description: Daily revenue aggregation across all delivered orders
    columns:
      - name: order_date
        tests:
          - unique
          - not_null
      - name: total_revenue
        tests:
          - not_null

  - name: dim_customers
    description: Customer dimension with enrichment and LTV data
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_state
        tests:
          - not_null

  - name: dim_products
    description: Product dimension with translated category names
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: dim_campaigns
    description: Unified campaign dimension across Google Ads and Meta Ads
    columns:
      - name: campaign_id
        tests:
          - not_null

  - name: metricflow_time_spine
    description: >
      MetricFlow-required time spine — one row per calendar day.
      Bounds are driven by dbt vars time_spine_start (default 2024-01-01) and
      time_spine_end (default 2026-12-31), defined in dbt_project.yml.
      Extend time_spine_end when the dataset grows beyond 2026-12-31.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        tests:
          - unique
          - not_null
