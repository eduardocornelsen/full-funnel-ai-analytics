semantic_models:
  - name: marketing_daily
    description: Daily marketing spend and GA4 session performance
    model: ref('fct_marketing_daily')
    defaults:
      agg_time_dimension: date
    entities:
      - name: marketing_day
        type: primary
        expr: date
    dimensions:
      - name: date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: total_spend
        description: Total paid media spend (Google + Meta)
        agg: sum
        expr: total_spend
      - name: total_conversions
        description: GA4 session-level conversions (canonical Session CVR denominator)
        agg: sum
        expr: total_conversions
      - name: total_sessions
        description: GA4 total sessions (all channels)
        agg: sum
        expr: ga4_total_sessions
      - name: total_ad_conversions
        description: Ad-platform conversions (Google + Meta clicks to purchase)
        agg: sum
        expr: total_ad_conversions
      - name: engaged_sessions
        description: GA4 engaged sessions
        agg: sum
        expr: ga4_engaged_sessions

  - name: orders
    description: Completed customer orders with attribution and revenue
    model: ref('fct_orders')
    defaults:
      agg_time_dimension: order_date
    entities:
      - name: order
        type: primary
        expr: order_id
      - name: customer
        type: foreign
        expr: customer_id
    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day
      - name: last_touch_channel
        type: categorical
      - name: payment_type
        type: categorical
      - name: order_status
        type: categorical
    measures:
      - name: revenue
        description: Order revenue (payment value)
        agg: sum
        expr: revenue
      - name: order_count
        description: Number of orders
        agg: count_distinct
        expr: order_id
      - name: avg_order_value
        description: Average order value
        agg: average
        expr: revenue

  - name: channel_performance
    # Previously this model had no time dimension, making all channel metrics permanently
    # all-time aggregations. fct_channel_performance.sql now outputs a date column
    # (daily × channel grain), so we can add agg_time_dimension here.
    description: Daily platform-level spend, attributed revenue, and orders (date × channel grain)
    model: ref('fct_channel_performance')
    defaults:
      # MetricFlow uses agg_time_dimension to align this semantic model's measures
      # with the time spine when a time-grain filter is applied (e.g. --group-by metric_time__month).
      # Without this, MetricFlow cannot filter channel_roas or channel_spend by date.
      agg_time_dimension: date
    entities:
      - name: channel_date
        # Composite primary key: date + channel, because neither alone is unique.
        # fct_channel_performance has one row per (date, channel) pair.
        type: primary
        expr: "channel || '_' || CAST(date AS VARCHAR)"
    dimensions:
      - name: date
        # Time dimension mapped to fct_channel_performance.date.
        # MetricFlow will use this column when filtering or grouping by time grain.
        type: time
        type_params:
          time_granularity: day       # base granularity; MetricFlow rolls up to week/month/quarter
      - name: channel
        # Categorical dimension for grouping metrics by paid platform (google_ads / meta_ads).
        type: categorical
    measures:
      - name: channel_spend
        description: Total paid-media spend for this platform channel on this date
        agg: sum
        expr: total_spend             # maps to fct_channel_performance.total_spend
      - name: channel_revenue
        description: Linear-attributed revenue for this platform channel on this date
        agg: sum
        expr: attributed_revenue      # maps to fct_channel_performance.attributed_revenue
      - name: channel_orders
        description: Orders attributed to this platform channel on this date
        agg: sum
        expr: total_orders            # maps to fct_channel_performance.total_orders

  - name: ga4_sessions
    description: Daily web sessions and engagement from GA4
    model: ref('stg_ga4_sessions')
    defaults:
      agg_time_dimension: date
    entities:
      - name: session_day_channel
        type: primary
        expr: "date || '_' || channel_group"
    dimensions:
      - name: date
        type: time
        type_params:
          time_granularity: day
      - name: channel_group
        type: categorical
    measures:
      - name: sessions
        description: Total sessions
        agg: sum
        expr: sessions
      - name: engaged_sessions
        description: Sessions with meaningful engagement
        agg: sum
        expr: engaged_sessions
      - name: new_users
        description: First-time visitors (proxy for leads)
        agg: sum
        expr: new_users
      - name: conversions
        description: GA4-tracked conversion events
        agg: sum
        expr: conversions

  - name: pipeline
    description: CRM pipeline from HubSpot and Salesforce combined
    model: ref('fct_pipeline')
    defaults:
      agg_time_dimension: close_date
    entities:
      - name: deal
        type: primary
        expr: deal_id
    dimensions:
      - name: close_date
        type: time
        type_params:
          time_granularity: day
      - name: stage
        type: categorical
      - name: source
        type: categorical
      - name: lead_source
        type: categorical
    measures:
      - name: pipeline_value
        description: Total deal/opportunity value in pipeline
        agg: sum
        expr: amount
      - name: deal_count
        description: Number of deals/opportunities
        agg: count_distinct
        expr: deal_id
