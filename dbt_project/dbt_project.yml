name: "olist_analytics"
version: "1.0.0"
config-version: 2
profile: "olist_analytics"
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

models:
  olist_analytics:
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table

# Project-wide date variables — override at run time with:
#   dbt build --vars '{"window_start":"2025-06-01","window_end":"2025-09-01"}'
#
# These drive:
#   - metricflow_time_spine.sql (time_spine_start / time_spine_end)
#   - fct_marketing_daily.sql  (window_start / window_end)
#   - int_dates.sql            (time_spine_start / time_spine_end)
#
# window_start / window_end are the canonical 90-day analysis window.
# For the synthetic dataset these are overridden at runtime by the scheduled
# refresh (generate_golden_metrics.py auto-detects MAX(date) from the DB).
# Update these manually after running `dbt run` with a new anchor, or use:
#   dbt run --vars '{"window_start":"YYYY-MM-DD","window_end":"YYYY-MM-DD"}'
# See CLAUDE.md §9 for the full anchor-detection rules.
vars:
  time_spine_start: "2024-01-01"   # earliest date MetricFlow spine must cover; extend for older data
  time_spine_end:   "2027-12-31"   # latest date MetricFlow spine must cover; extend when dataset grows
  window_start:     "2025-12-16"   # fallback — overridden by generate_golden_metrics.py at runtime
  window_end:       "2026-03-15"   # fallback — overridden by generate_golden_metrics.py at runtime
